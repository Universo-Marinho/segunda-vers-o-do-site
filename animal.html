<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Marinho</title>
    <link rel="stylesheet" href="animal.css">
</head>

<body>

    <header class="topo">

        <h1>
            Universo <span>Marinho</span>
        </h1>

        <a href="index.html" class="voltar">
            Voltar
        </a>

    </header>

    <main>

        <section class="cabecalho-animal">

            <div class="imagem-animal">

                <img
                    id="imagem"
                    src=""
                    alt=""
                >

            </div>

            <div class="nome-animal">

                <p class="categoria">
                    ESPÉCIE MARINHA
                </p>

                <h2 id="nome-animal">
                    Animal
                </h2>

                <p id="nome-cientifico">
                    Nome científico
                </p>

            </div>

        </section>

        <section class="introducao">

            <div class="bloco-introducao">

                <h3>
                    Introdução
                </h3>

                <p id="introducao"></p>

            </div>

        </section>

        <section class="informacoes">

            <div class="bloco-info">

                <h3>
                    O que come?
                </h3>

                <p id="alimentacao"></p>

            </div>

            <div class="bloco-info">

                <h3>
                    Onde vive?
                </h3>

                <p id="habitat"></p>

            </div>

            <div class="bloco-info">

                <h3>
                    Reprodução
                </h3>

                <p id="reproducao"></p>

            </div>

            <div class="bloco-info">

                <h3>
                    Ameaças
                </h3>

                <p id="ameacas"></p>

            </div>

            <div class="bloco-info">

                <h3>
                    Estado de conservação
                </h3>

                <p id="conservacao"></p>

            </div>

            <div class="bloco-info">

                <h3>
                    Curiosidades
                </h3>

                <p id="curiosidades"></p>

            </div>

        </section>

        <section class="importancia">

            <h3>
                Importância da espécie
            </h3>

            <p id="importancia"></p>

        </section>

        <section class="fontes" id="bloco-fontes">

            <h3>
                Onde foram encontradas as informações?
            </h3>

            <p id="fontes"></p>

        </section>

    </main>

    <footer class="rodape">

        <p>
            Universo Marinho
        </p>

    </footer>

    <script src="animal.js"></script>

</body>

</html>
